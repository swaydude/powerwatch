name: PowerWatch
options:
  bundleIdPrefix: com.swanky
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PowerWatchCore:
    path: .

targets:
  PowerWatch:
    type: application
    platform: iOS
    sources:
      - PowerWatch
    dependencies:
      - package: PowerWatchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swanky.powerwatch
        DEVELOPMENT_TEAM: 5ZMY3Q3K9L
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        # Single-size iOS icon (1024 px, no alpha) drawn by
        # PowerWatch/Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # BLE (phase 3) needs Bluetooth usage descriptions; declared now so
        # the release build (T6.2) doesn't need Info.plist surgery.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "PowerWatch connects to your MATRIX watch over Bluetooth to sync activity data."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "PowerWatch connects to your MATRIX watch over Bluetooth to sync activity data."
        SWIFT_VERSION: "5.9"
    info:
      path: PowerWatch/Info.plist
      properties:
        # CBCentralManager state restoration (T6.2) requires this mode;
        # without it the restore-identifier init aborts at launch.
        UIBackgroundModes: [bluetooth-central]
        # T3.4 pairing: the camera scans the QR code on the watch.
        NSCameraUsageDescription: "PowerWatch uses the camera to scan the pairing QR code shown on your watch."

  PowerWatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PowerWatchUITests
    dependencies:
      - target: PowerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swanky.powerwatch.uitests
        TEST_TARGET_NAME: PowerWatch
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"

schemes:
  PowerWatch:
    build:
      targets:
        PowerWatch: all
        PowerWatchUITests: [test]
    test:
      targets:
        - PowerWatchUITests
